<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0A0A0B" />

    <title>SHIVANK — Creative Designer</title>
    <meta
      name="description"
      content="SHIVANK is a multidisciplinary creative designer building visual experiences through design, motion and technology."
    />
    <meta property="og:title" content="SHIVANK — Creative Designer" />
    <meta
      property="og:description"
      content="Visual experiences through design, motion and technology."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Self-hosted variable faces: no third-party connection before first
         paint, and the display face is requested before the CSS resolves. -->
    <link
      rel="preload"
      href="/fonts/archivo-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Paint the canvas colour before the bundle arrives: no white flash into the preloader. -->
    <style>
      html {
        background: #0a0a0b;
      }
      html,
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="color: #f2efe9; font-family: sans-serif; padding: 8vw 6vw; max-width: 60ch">
        <h1 style="font-size: 12vw; margin: 0 0 0.4em; letter-spacing: -0.04em">SHIVANK</h1>
        <p>
          Creative Designer — building visual experiences through design, motion &amp; technology.
          This portfolio is an interactive 3D experience and needs JavaScript enabled. Reach me at
          <a style="color: #e2552d" href="mailto:hello@shivank.studio">hello@shivank.studio</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
